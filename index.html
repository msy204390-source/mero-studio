<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2B3BFF">
<title>Mero Studio</title>
<meta name="description" content="Mero Studio: an AI studio for social media posts, graphic designs, ads and writing in 7 languages, from one simple command.">
<meta property="og:title" content="Mero Studio">
<meta property="og:description" content="Posts, designs, ads and writing in 7 languages, from one simple command.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%232B3BFF'/%3E%3Cpath d='M8 23V9l8 9 8-9v14' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='7' r='3' fill='%23FFB800'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: one calm column. Hero with a live sample design, then the studio (tabs, brand kit, form, results, history), services, steps, one price, FAQ, contact. */
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --fg: #0D1220;
  --muted: #566075;
  --line: #D3D8E2;
  --accent: #2B3BFF;
  --accent-ink: #FFFFFF;
  --hi: #FFB800;
  --ok: #17803D;
  --bad: #B3261E;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Readex Pro", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A0D16; --surface: #121726; --fg: #E8ECF4; --muted: #98A2B8; --line: #252C40;
    --accent: #7C8BFF; --accent-ink: #0A0D16; --hi: #FFC940; --ok: #5CC98B; --bad: #FF8A80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
.wrap { max-width: 1040px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.25; text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--font-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.brand svg { width: 28px; height: 28px; flex: none; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 16px; font-size: 14px; }
nav.nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
nav.nav::-webkit-scrollbar { display: none; }
nav.nav a { color: var(--fg); text-decoration: none; font-size: 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; white-space: nowrap; }
nav.nav a:hover { border-color: var(--accent); }

.hero { display: grid; gap: 28px; padding-block: 24px 44px; align-items: center; }
@media (min-width: 780px) { .hero { grid-template-columns: 1.15fr .85fr; } }
.hero h1 { font-size: clamp(30px, 7vw, 52px); font-weight: 700; }
.hero .lead { color: var(--muted); font-size: 17px; margin-top: 14px; max-width: 54ch; }
.hero .cta-row { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.hero .meta { color: var(--muted); font-size: 14px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 12px 24px; font-weight: 700; text-decoration: none; display: inline-block; text-align: center; }
.btn:disabled { opacity: .6; cursor: default; }
.btn2 { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; font-size: 14px; text-decoration: none; color: var(--fg); display: inline-block; }
.btn2:hover { border-color: var(--accent); }
.btn2:disabled { opacity: .55; cursor: default; }
.sample { position: relative; max-width: 380px; width: 100%; margin-inline: auto; }
.sample img { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 0 0 1px var(--line), 0 18px 40px -18px rgba(13, 18, 32, .45); background: #fff; }
.sample .tag { position: absolute; top: 10px; inset-inline-start: 10px; background: var(--hi); color: #0D1220; font-family: var(--font-data); font-size: 12px; padding: 2px 8px; border-radius: 3px; }

section { padding-block: 40px; border-top: 1px solid var(--line); }
section > h2 { font-size: clamp(22px, 4.5vw, 32px); }
section > p.sub { color: var(--muted); margin-top: 8px; max-width: 62ch; }

.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-top: 22px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 18px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.studio { display: grid; gap: 22px; margin-top: 22px; }
@media (min-width: 900px) { .studio { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); align-items: start; } }
.form { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.f { display: grid; gap: 6px; min-width: 0; }
.f > .lb { font-size: 14px; color: var(--muted); }
.f input[type="text"], .f select, .f textarea { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.f textarea { resize: vertical; min-height: 96px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 2px 12px; font-size: 13px; text-align: start; }
.chip:hover:not(:disabled) { border-color: var(--accent); }
.chip:disabled { opacity: .55; cursor: default; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 12px; font-size: 14px; cursor: pointer; }
.checks input { accent-color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); }
details.kit { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); margin: 0; }
details.kit summary { padding: 10px 12px; font-size: 14px; font-weight: 600; }
details.kit .kitbody { padding: 0 12px 12px; display: grid; gap: 10px; }
.colors { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 14px; }
.colors label.cb { display: inline-flex; align-items: center; gap: 6px; }
.colors input[type="color"] { width: 36px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
.out { min-width: 0; display: grid; gap: 22px; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 28px 18px; color: var(--muted); text-align: center; }
.status { color: var(--muted); padding: 18px 0; }
.status.err { color: var(--bad); }
.item { padding-block: 18px; border-top: 1px solid var(--line); display: grid; gap: 12px; min-width: 0; }
.item:first-child { border-top: 0; padding-top: 0; }
.item .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.75; }
.item .tags { color: var(--accent); font-size: 14px; overflow-wrap: anywhere; }
.item .vis { color: var(--muted); font-size: 14px; }
.item .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.item h3 { font-size: 18px; }
.count { font-family: var(--font-data); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count.over { color: var(--bad); }
.refine { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.editor { display: grid; gap: 14px; min-width: 0; }
.edprev { display: grid; gap: 10px; align-content: start; justify-items: start; }
.edprev img { width: 100%; max-width: 440px; height: auto; display: block; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.edctl { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.edctl > summary { padding: 10px 14px; font-weight: 600; font-size: 14px; }
.edbody { padding: 0 14px 14px; display: grid; gap: 12px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 44px; height: 30px; border-radius: 6px; border: 2px solid var(--line); padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--accent); }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.thumb { flex: none; width: 84px; padding: 0; border: 2px solid var(--line); border-radius: 4px; background: #fff; overflow: hidden; }
.thumb[aria-pressed="true"] { border-color: var(--accent); }
.thumb img { width: 100%; height: auto; display: block; }
.camp { display: grid; gap: 14px; padding-block: 20px; border-top: 1px solid var(--line); min-width: 0; }
.camp:first-child { border-top: 0; padding-top: 0; }
.camp h3 { font-size: 18px; }
@media (min-width: 700px) { .camp { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } .camp > h3 { grid-column: 1 / -1; } }

details.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
details.hist summary { padding: 10px 14px; font-weight: 600; font-size: 14px; }
.histlist { padding: 0 14px 14px; display: grid; gap: 6px; }
.histrow { display: flex; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px; }
.histrow button.go { background: none; border: 0; padding: 0; text-align: start; color: var(--fg); font-size: 14px; overflow-wrap: anywhere; }
.histrow button.go:hover { color: var(--accent); }

.svc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding-block: 16px; border-top: 1px solid var(--line); }
#svcList { margin-top: 18px; }
.svc h3 { font-size: 18px; }
.svc p { color: var(--muted); font-size: 15px; margin-top: 2px; }
ol.steps { list-style: none; margin: 18px 0 0; padding: 0; counter-reset: s; display: grid; }
ol.steps li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding-block: 16px; border-top: 1px solid var(--line); counter-increment: s; }
ol.steps li::before { content: counter(s); font-family: var(--font-data); font-size: 22px; color: var(--accent); }
ol.steps h3 { font-size: 17px; }
ol.steps p { color: var(--muted); font-size: 15px; margin-top: 2px; }

.plan { margin-top: 20px; max-width: 460px; background: var(--surface); border: 2px solid var(--accent); border-radius: 8px; padding: 22px; display: grid; gap: 14px; }
.plan .price { font-family: var(--font-data); font-size: 44px; font-weight: 500; line-height: 1; }
.plan .price small { font-size: 16px; color: var(--muted); }
.plan .free { justify-self: start; background: var(--hi); color: #0D1220; font-family: var(--font-data); font-size: 13px; padding: 2px 10px; border-radius: 3px; }
.plan ul { margin: 0; padding: 0; padding-inline-start: 20px; display: grid; gap: 4px; }
.pay { margin-top: 28px; display: grid; gap: 12px; }
.pay h3 { font-size: 20px; }
.paygrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.paycard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.paycard.rec { border-color: var(--accent); }
.paycard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.paycard .coin { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.chipnet { font-family: var(--font-data); font-size: 12px; border: 1px solid currentColor; border-radius: 4px; padding: 2px 8px; color: var(--accent); white-space: nowrap; }
.paycard .warn { font-size: 14px; color: var(--bad); font-weight: 600; }
.paycard .addr { font-family: var(--font-data); font-size: 14px; direction: ltr; text-align: left; unicode-bidi: isolate; overflow-wrap: anywhere; word-break: break-all; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; user-select: all; }
.paycard .small { font-size: 13px; color: var(--muted); }
.note { color: var(--muted); font-size: 14px; max-width: 62ch; }
section .note { margin-top: 12px; }

details.faq { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; margin-top: 10px; }
details.faq summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; gap: 12px; align-items: center; font-family: var(--font-display); font-weight: 600; }
details.faq summary::-webkit-details-marker { display: none; }
details.faq summary::after { content: "+"; margin-inline-start: auto; font-family: var(--font-data); color: var(--muted); }
details.faq[open] summary::after { content: "\2212"; }
details.faq p { padding: 0 16px 14px; color: var(--muted); }
#faqList { margin-top: 18px; }

.contact { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.contact .num { font-family: var(--font-data); font-size: 20px; direction: ltr; unicode-bidi: isolate; user-select: all; }
footer { padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="var(--accent)"/><path d="M8 23V9l8 9 8-9v14" fill="none" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="25" cy="7" r="3" fill="var(--hi)"/></svg>
      Mero Studio
    </div>
    <button class="pill" id="langBtn" type="button" aria-label="Language">EN</button>
  </header>
  <nav class="nav" id="nav"></nav>

  <div class="hero">
    <div>
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>
      <div class="cta-row">
        <a class="btn" href="#studio" data-i="cta"></a>
        <span class="meta" data-i="heroMeta"></span>
      </div>
    </div>
    <div class="sample">
      <img id="sampleImg" alt="">
      <span class="tag" data-i="sampleTag"></span>
    </div>
  </div>

  <section id="studio">
    <h2 data-i="studioT"></h2>
    <p class="sub" data-i="studioS"></p>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="studio">
      <form class="form" id="form" novalidate>
        <details class="kit" id="kit">
          <summary data-i="kitT"></summary>
          <div class="kitbody">
            <p class="hint" data-i="kitS"></p>
            <div class="f"><span class="lb" data-i="lBrand"></span><input id="brand" type="text" maxlength="60" autocomplete="off" aria-label="brand"></div>
            <div class="f"><span class="lb" data-i="lAbout"></span><textarea id="about" rows="2" maxlength="300" aria-label="about"></textarea></div>
            <div class="colors">
              <label class="cb"><input type="checkbox" id="useColors"><span data-i="useColors"></span></label>
              <label class="cb"><span data-i="c1"></span><input type="color" id="c1" value="#2B3BFF"></label>
              <label class="cb"><span data-i="c2"></span><input type="color" id="c2" value="#FFB800"></label>
            </div>
          </div>
        </details>
        <div class="f">
          <label class="lb" for="brief" id="briefLbl"></label>
          <textarea id="brief" rows="4" maxlength="800"></textarea>
          <div class="chips" id="chips"></div>
        </div>
        <div class="f" data-for="campaign">
          <span class="lb" data-i="lPlatforms"></span>
          <div class="checks" id="campPlat"></div>
        </div>
        <div class="f" data-for="write">
          <label class="lb" for="source" data-i="lSource"></label>
          <textarea id="source" rows="3" maxlength="1500"></textarea>
        </div>
        <div class="row2">
          <div class="f" data-for="posts ads"><label class="lb" for="platform" data-i="lPlatform"></label><select id="platform"></select></div>
          <div class="f" data-for="design"><label class="lb" for="format" data-i="lFormat"></label><select id="format"></select></div>
          <div class="f" data-for="write"><label class="lb" for="kind" data-i="lKind"></label><select id="kind"></select></div>
          <div class="f" data-for="write"><label class="lb" for="length" data-i="lLength"></label><select id="length"></select></div>
        </div>
        <div class="f" data-for="ads"><label class="lb" for="offer" data-i="lOffer"></label><input id="offer" type="text" maxlength="120" autocomplete="off"></div>
        <div class="f" data-for="ads"><label class="lb" for="audience" data-i="lAudience"></label><input id="audience" type="text" maxlength="120" autocomplete="off"></div>
        <div class="row2">
          <div class="f"><label class="lb" for="tone" data-i="lTone"></label><select id="tone"></select></div>
          <div class="f"><label class="lb" for="outLang" data-i="lOut"></label><select id="outLang"></select></div>
        </div>
        <button class="btn" id="go" type="submit"></button>
        <p class="hint" id="tabHint"></p>
      </form>
      <div class="out">
        <div id="out" aria-live="polite"></div>
        <details class="hist" id="histBox">
          <summary data-i="histT"></summary>
          <div class="histlist" id="histList"></div>
        </details>
      </div>
    </div>
  </section>

  <section id="services">
    <h2 data-i="svcT"></h2>
    <div id="svcList"></div>
  </section>

  <section id="how">
    <h2 data-i="howT"></h2>
    <ol class="steps" id="howList"></ol>
  </section>

  <section id="pricing">
    <h2 data-i="priceT"></h2>
    <p class="sub" data-i="priceS"></p>
    <div class="plan">
      <h3 data-i="planName"></h3>
      <div class="price">$15 <small data-i="perMonth"></small></div>
      <span class="free" data-i="trial"></span>
      <ul id="planList"></ul>
      <a class="btn" id="waPlan" href="#pay" data-i="startWa"></a>
    </div>
    <div class="pay" id="pay">
      <h3 data-i="payT"></h3>
      <p class="note" data-i="payS"></p>
      <div class="paygrid" id="payList"></div>
      <p class="note" data-i="payAfter"></p>
    </div>
    <p class="note" data-i="priceNote"></p>
  </section>

  <section id="faq">
    <h2 data-i="faqT"></h2>
    <div id="faqList"></div>
  </section>


  <footer data-i="foot"></footer>
</div>

<script>
/* ========== Text ========== */
var L = {
ar: {
 h1: "منشوراتك وتصاميمك وإعلاناتك وكتابتك، من أمر واحد",
 lead: "اكتب جملة وحدة بتوصفلنا شو بدك، وبيطلعلك منشور وتصميم لكل منصة بنفس الألوان والهوية، بسبع لغات.",
 cta: "جرّب الاستوديو مجاناً", heroMeta: "بدون تسجيل", sampleTag: "مثال",
 studioT: "الاستوديو", studioS: "اختار نوع الشغل، اكتب فكرتك، واضغط. النتيجة بتظهر خلال ثواني وبتقدر تعدّل عليها.",
 tabs: { campaign: "حملة بأمر واحد", posts: "منشورات", design: "تصاميم", ads: "إعلانات", write: "كتابة" },
 briefLbl: { campaign: "اكتب أمرك بجملة وحدة", posts: "شو بدك تنشر؟", design: "شو موضوع التصميم؟", ads: "شو بدك تعلن عنه؟", write: "شو بدك نكتبلك؟" },
 kitT: "هويتي (اختياري)", kitS: "بتنحفظ على جهازك وبتنطبق على كل الأدوات.", lBrand: "اسم العلامة أو المحل", lAbout: "نبذة قصيرة عن نشاطك",
 useColors: "استخدم ألواني بالتصاميم", c1: "الأساسي", c2: "المساعد",
 lPlatforms: "المنصات", lSource: "نص بدك نشتغل عليه (للترجمة أو إعادة الصياغة)",
 lPlatform: "المنصة", lFormat: "المقاس", lKind: "نوع النص", lLength: "الطول", lOffer: "العرض (اختياري)", lAudience: "الجمهور (اختياري)",

      }).catch(function () { msg.textContent = L[lang].refineFail; })
        .then(function () { btns.forEach(function (x) { x.disabled = false; }); });
    });
    bar.appendChild(b);
  });
  undo.addEventListener("click", function () { if (stack.length) setText(stack.pop()); if (!stack.length) undo.hidden = true; });
  bar.appendChild(undo); bar.appendChild(msg);
  return bar;
}
function textItem(label, p, extra) {
  var t = L[lang], it = el("div", "item");
  if (label) it.appendChild(el("span", "label", label));
  var tx = el("div", "txt", p.text); tx.setAttribute("dir", "auto"); it.appendChild(tx);
  if (extra && extra.beforeText) extra.beforeText(it, tx);
  if (p.hashtags && p.hashtags.length) { var h = el("div", "tags", p.hashtags.join(" ")); h.setAttribute("dir", "auto"); it.appendChild(h); }
  if (p.visual) { var v = el("div", "vis", t.visualIdea + p.visual); v.setAttribute("dir", "auto"); it.appendChild(v); }
  it.appendChild(refineBar(function () { return p.text; }, function (s) { p.text = s; tx.textContent = s; if (extra && extra.onText) extra.onText(s); }, "post"));
  var bar = el("div", "bar"); bar.appendChild(el("span", "hint", t.reviewNote));
  bar.appendChild(copyBtn(function () { return p.text + (p.hashtags && p.hashtags.length ? "\n\n" + p.hashtags.join(" ") : ""); }));
  it.appendChild(bar);
  return it;
}
function renderPosts(data) {
  var t = L[lang], o = $("out");
  o.replaceChildren();

}
function renderAds(data) {

    it.appendChild(refineBar(function () { return a.text; }, function (s) { a.text = s; tx.textContent = s; cnt.textContent = s.length + " / " + lim[1]; cnt.className = "count" + (s.length > lim[1] ? " over" : ""); }, "ad"));
    var bar = el("div", "bar"); bar.appendChild(el("span", "hint", t.reviewNote));
    bar.appendChild(copyBtn(function () { return a.headline + "\n" + a.text + (a.cta ? "\n" + a.cta : ""); }));

}
function renderDesigns(data, fmt, brandName) {
  var o = $("out"), concepts = data.designs, idx = 0, thumbs = [];

    var im = el("img"); im.src = svgUrl(buildSvg(c, fmt, brandName || data.brand || "")); im.alt = ""; b.appendChild(im);
    b.addEventListener("click", function () { idx = i; ed.setSpec(concepts[i]); thumbs.forEach(function (x, j) { x.setAttribute("aria-pressed", String(j === i)); }); });

function renderCampaign(data, fmt, brandName) {
  var t = L[lang], o = $("out"), pl = {};
  t.platC.forEach(function (p) { pl[p[0]] = p[1]; });
  o.replaceChildren();

    box.appendChild(createEditor(it.design, CAMP_FORMAT[it.platform] || "square", brandName || data.brand || "", false).el);
    box.appendChild(textItem("", it));

function renderWrite(data) {
  var t = L[lang], o = $("out"), it = el("div", "item");
  o.replaceChildren();
  if (data.title) { var h = el("h3", null, data.title); h.setAttribute("dir", "auto"); it.appendChild(h); }
  var tx = el("div", "txt", data.text); tx.setAttribute("dir", "auto"); it.appendChild(tx);

function renderResult(name, data, fmt, brandName) {
  if (name === "posts") renderPosts(data);
  else if (name === "ads") renderAds(data);
  else if (name === "design") renderDesigns(data, fmt || "square", brandName);
  else if (name === "campaign") renderCampaign(data, fmt, brandName);

}
function showEmpty() { $("out").replaceChildren(el("div", "empty", L[lang].empty)); }
function showStatus(text, isErr) { $("out").replaceChildren(el("div", "status" + (isErr ? " err" : ""), text)); }

/* ========== Tabs and form ========== */
function renderExamples() {
  var ex = L[lang].examples[tab], box = $("chips");
  box.replaceChildren();
  ex.forEach(function (t) {
    var c = el("button", "chip", t); c.type = "button";
    c.addEventListener("click", function () { $("brief").value = t; briefs[tab] = t; seeded[tab] = false; });
    box.appendChild(c);
  });
}
function renderCampPlat() {
  var box = $("campPlat"), prev = {}, any = false;
  Array.prototype.forEach.call(box.querySelectorAll("input"), function (i) { prev[i.value] = i.checked; any = true; });
  box.replaceChildren();
  L[lang].platC.forEach(function (p) {
    var lab = el("label"), i = el("input"); i.type = "checkbox"; i.value = p[0];
    i.checked = any ? !!prev[p[0]] : (p[0] === "x" || p[0] === "linkedin" || p[0] === "instagram");
    lab.appendChild(i); lab.appendChild(el("span", null, p[1])); box.appendChild(lab);
  });
}
function applyTab() {
  var t = L[lang], i, nodes = document.querySelectorAll("[data-for]"), btns = $("tabs").children;
  for (i = 0; i < btns.length; i++) {
    var on = btns[i].getAttribute("data-tab") === tab;
    btns[i].setAttribute("aria-selected", on ? "true" : "false"); btns[i].tabIndex = on ? 0 : -1;
  }
  for (i = 0; i < nodes.length; i++) nodes[i].hidden = nodes[i].getAttribute("data-for").split(" ").indexOf(tab) < 0;
  $("briefLbl").textContent = t.briefLbl[tab];
  $("go").textContent = t.gen[tab];
  $("tabHint").textContent = t.hints[tab];
  if (tab === "posts") fillSelect($("platform"), t.platP, true);
  if (tab === "ads") fillSelect($("platform"), t.platA, true);
  $("brief").value = briefs[tab] || (seeded[tab] ? t.examples[tab][0] : "");
  renderExamples();
}
function setTab(name, scroll) {
  briefs[tab] = $("brief").value;
  tab = name; applyTab();
  if (scroll) $("studio").scrollIntoView();
}
function renderTabs() {
  var box = $("tabs");
  box.replaceChildren();
  TABS.forEach(function (k) {
    var b = el("button", "tab", L[lang].tabs[k]); b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("data-tab", k);
    b.addEventListener("click", function () { setTab(k, false); });
    b.addEventListener("keydown", function (e) {
      var i = TABS.indexOf(k), step = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!step) return;
      if (document.documentElement.dir === "rtl") step = -step;
      var nx = TABS[(i + step + TABS.length) % TABS.length];
      setTab(nx, false); box.querySelector('[data-tab="' + nx + '"]').focus();
      e.preventDefault();
    });
    box.appendChild(b);
  });
}

$("form").addEventListener("submit", function (e) {
  e.preventDefault();
  var t = L[lang], brief = $("brief").value.trim();
  if (busy) return;
  if (brief.length < 5) { showStatus(t.short, true); return; }
  var plats = Array.prototype.filter.call($("campPlat").querySelectorAll("input"), function (i) { return i.checked; }).map(function (i) { return i.value; });
  if (tab === "campaign" && !plats.length) { showStatus(t.platErr, true); return; }
  briefs[tab] = brief; saveKit();
  var payload = {
    brief: brief, brand: $("brand").value, about: $("about").value, colors: kitColors(), out: $("outLang").value, tone: $("tone").value,
    platform: $("platform").value, offer: $("offer").value, audience: $("audience").value,
    format: $("format").value, kind: $("kind").value, length: $("length").value, source: $("source").value, platforms: plats
  };
  var current = tab, fmt = tab === "design" ? payload.format : "square", brandName = payload.brand;
  busy = true; $("go").disabled = true; showStatus(t.loading, false);
  post(ENDPOINT[current], payload)
    .then(function (x) {
      if (!x.ok) { showStatus(errText(x), true); return; }
      renderResult(current, x.d, fmt, brandName);
      pushHist({ tab: current, label: brief.slice(0, 36), ts: Date.now(), data: x.d, fmt: fmt, brand: brandName });
    })
    .catch(function () { showStatus(L[lang].fail, true); })
    .then(function () { busy = false; $("go").disabled = false; });
});

  box = $("nav"); box.replaceChildren();
  [["#studio", t.studioT], ["#services", t.svcT], ["#how", t.howT], ["#pricing", t.priceT], ["#faq", t.faqT]].forEach(function (x) {

function renderSample() {
  var s = L[lang].sample;
  var svg = buildSvg({ headline: s.headline, subline: s.subline, cta: s.cta, highlight: s.highlight, layout: "badge", motif: "circles", bg: "#0D1220", fg: "#F3F4F7", accent: "#FFB800" }, "square", s.brand);
  $("sampleImg").src = svgUrl(svg); $("sampleImg").alt = s.headline;
}
function applyLang() {
  var t = L[lang], els = document.querySelectorAll("[data-i]"), i;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  for (i = 0; i < els.length; i++) els[i].textContent = t[els[i].getAttribute("data-i")];
  $("langBtn").textContent = lang === "ar" ? "EN" : "عربي";
  fillSelect($("tone"), t.tones, true); fillSelect($("outLang"), OUTLANGS, true);
  fillSelect($("format"), t.formats, true); fillSelect($("kind"), t.kinds, true); fillSelect($("length"), t.lengths, true);
  if (!$("outLang").dataset.touched) $("outLang").value = lang;
  renderTabs(); renderCampPlat(); renderStatic(); renderSample(); applyTab(); renderHist();
  var first = $("out").firstChild;
  if (!first || first.className === "empty") showEmpty();
}
$("outLang").addEventListener("change", function () { this.dataset.touched = "1"; });
["brand", "about", "useColors", "c1", "c2"].forEach(function (id) { $(id).addEventListener("input", saveKit); $(id).addEventListener("change", saveKit); });
$("langBtn").addEventListener("click", function () {
  briefs[tab] = $("brief").value;
  Object.keys(seeded).forEach(function (k) { if (seeded[k]) briefs[k] = ""; });
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("ms-lang", lang); } catch (e) {}

loadKit();
applyLang();
